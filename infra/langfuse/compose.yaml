# Adapted from https://github.com/langfuse/langfuse/blob/v4.33.0/docker-compose.yml
# Development instance: only the UI and media endpoint are exposed, on localhost.
services:
  web:
    image: docker.langfuse.com/langfuse/langfuse:4.33.0
    restart: "no"
    depends_on: &dependencies
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["127.0.0.1:3300:3000", "[::1]:3300:3000"]
    environment:
      <<: &shared
        DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
        NEXTAUTH_URL: http://localhost:3300
        SALT: ${SALT}
        ENCRYPTION_KEY: ${ENCRYPTION_KEY}
        TELEMETRY_ENABLED: "false"
        CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
        CLICKHOUSE_URL: http://clickhouse:8123
        CLICKHOUSE_USER: clickhouse
        CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
        CLICKHOUSE_CLUSTER_ENABLED: "false"
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        REDIS_AUTH: ${REDIS_AUTH}
        LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
        LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
        LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
        LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
        LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
        LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
        LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
        LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
        LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
        LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
        LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
        LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
        LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: soul-local
      LANGFUSE_INIT_ORG_NAME: Soul
      LANGFUSE_INIT_PROJECT_ID: soul-tools
      LANGFUSE_INIT_PROJECT_NAME: Soul Tools
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: Soul Developer
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD}
  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.33.0
    restart: "no"
    depends_on: *dependencies
    environment:
      <<: *shared
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  postgres:
    image: postgres:17
    restart: "no"
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: postgres }
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: "no"
    user: "101:101"
    environment: { CLICKHOUSE_DB: default, CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}" }
    volumes: ["clickhouse:/var/lib/clickhouse", "clickhouse-logs:/var/log/clickhouse-server"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    restart: "no"
    command: ["redis-server", "--requirepass", "${REDIS_AUTH}", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_AUTH redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment: { REDIS_AUTH: "${REDIS_AUTH}" }
  minio:
    image: cgr.dev/chainguard/minio
    restart: "no"
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    ports: ["127.0.0.1:9090:9000", "[::1]:9090:9000"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20
volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
  redis:
  minio:
