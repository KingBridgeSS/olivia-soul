# WSL mirrored mode: a host-network listener lets Windows reach localhost.
# Keep Docker's internal published ports on IPv6 loopback; do not alter WSL routes.
services:
  web:
    ports: !override ["[::1]:3302:3000"]
  minio:
    ports: !override ["[::1]:9092:9000"]
  loopback:
    image: nginx:alpine
    restart: "no"
    network_mode: host
    depends_on: [web, minio]
    volumes: ["./loopback.conf:/etc/nginx/conf.d/default.conf:ro"]
